<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AudLabs — Email Campaigns</title>
<link rel="icon" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0d0d0d;color:#eee;font-family:'Inter',sans-serif;min-height:100vh;}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.login-card{background:#161616;border:1px solid #262626;border-radius:16px;padding:40px;max-width:380px;width:100%;}
.login-card h1{font-size:18px;font-weight:700;color:#c9a84c;margin-bottom:4px;letter-spacing:0.05em;}
.login-card p{font-size:13px;color:#888;margin-bottom:24px;}
.login-inp{width:100%;background:#0d0d0d;border:1.5px solid #262626;border-radius:8px;padding:12px 14px;font-size:14px;color:#eee;outline:none;margin-bottom:12px;font-family:'Inter',sans-serif;}
.login-inp:focus{border-color:#c9a84c;}
.login-btn{width:100%;background:linear-gradient(180deg,#e8c97a 0%,#c9a84c 45%,#b8934a 100%);border:1px solid rgba(184,147,74,0.5);color:#111;padding:12px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(201,168,76,0.35),inset 0 1px 0 rgba(255,255,255,0.5);}
.login-err{font-size:12px;color:#e74c3c;margin-top:10px;text-align:center;}
#dashboard{display:none;max-width:1100px;margin:0 auto;padding:32px 20px 60px;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;flex-wrap:wrap;gap:12px;}
.topbar h1{font-size:20px;font-weight:700;color:#fff;}
.topbar span{font-size:12px;color:#c9a84c;font-family:'Space Mono',monospace;}
.card{background:#161616;border:1px solid #262626;border-radius:14px;padding:24px;margin-bottom:20px;}
.card-title{font-size:13px;font-weight:700;color:#c9a84c;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:18px;display:flex;align-items:center;gap:8px;}
.dot{width:6px;height:6px;background:#c9a84c;border-radius:50%;display:inline-block;}
.field-lbl{font-size:12px;font-weight:600;color:#999;margin-bottom:6px;display:block;}
.field-inp{width:100%;background:#0d0d0d;border:1.5px solid #262626;border-radius:8px;padding:11px 14px;font-size:14px;color:#eee;outline:none;margin-bottom:16px;font-family:'Inter',sans-serif;}
.field-inp:focus{border-color:#c9a84c;}
.field-hint{font-size:11px;color:#666;margin-top:-12px;margin-bottom:16px;}
textarea.field-inp{min-height:260px;font-family:'Space Mono',monospace;font-size:12px;line-height:1.6;resize:vertical;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
.btn{padding:11px 20px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:'Inter',sans-serif;transition:all 0.15s;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
.btn-gold{background:linear-gradient(180deg,#e8c97a 0%,#c9a84c 45%,#b8934a 100%);color:#111;box-shadow:0 3px 10px rgba(201,168,76,0.35);}
.btn-gold:hover:not(:disabled){filter:brightness(1.06);}
.btn-outline{background:transparent;border:1.5px solid #333;color:#ccc;}
.btn-outline:hover:not(:disabled){border-color:#c9a84c;color:#c9a84c;}
.btn-green{background:#1f7a4d;color:#fff;}
.btn-green:hover:not(:disabled){filter:brightness(1.1);}
.btn-red{background:#3a1414;color:#e74c3c;border:1px solid #5a1e1e;}
#preview-frame{width:100%;height:520px;border:1px solid #262626;border-radius:10px;background:#fff;display:none;}
.status-msg{font-size:13px;margin-top:10px;padding:10px 14px;border-radius:8px;display:none;}
.status-ok{background:rgba(39,174,96,0.1);color:#27ae60;border:1px solid rgba(39,174,96,0.25);}
.status-err{background:rgba(231,76,60,0.1);color:#e74c3c;border:1px solid rgba(231,76,60,0.25);}
.campaign-item{padding:14px 16px;background:#0d0d0d;border:1px solid #222;border-radius:10px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.campaign-name{font-size:14px;font-weight:600;color:#eee;}
.campaign-sub{font-size:12px;color:#888;margin-top:2px;}
.campaign-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px;white-space:nowrap;}
.badge-sent{background:rgba(39,174,96,0.12);color:#27ae60;}
.badge-draft{background:rgba(201,168,76,0.12);color:#c9a84c;}
.empty-state{text-align:center;color:#666;font-size:13px;padding:30px;}
@media(max-width:640px){.topbar{flex-direction:column;align-items:flex-start;}.btn-row{flex-direction:column;}.btn{width:100%;text-align:center;}}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h1>AudLabs Mail</h1>
    <p>Admin access required to send email campaigns.</p>
    <div style="position:relative;display:flex;align-items:center;">
<input type="password" class="login-inp" id="admin-pass" placeholder="Admin password" style="padding-right:44px;margin-bottom:0;" onkeydown="if(event.key==='Enter')adminLogin()">
<button type="button" onclick="toggleAdminPwd()" style="position:absolute;right:10px;background:none;border:none;cursor:pointer;color:#999;padding:0;margin:0;width:24px;height:24px;display:flex;align-items:center;justify-content:center;" id="admin-pwd-eye">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
</button>
</div>
    <button class="login-btn" onclick="adminLogin()">Sign In</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<div id="dashboard">
  <div class="topbar">
    <div>
      <h1>Email Campaigns</h1>
      <span>mail.audlabs.io</span>
    </div>
    <button class="btn btn-outline" onclick="adminLogout()">Sign Out</button>
  </div>

  <div class="card">
    <div class="card-title"><span class="dot"></span>Compose Campaign</div>
    <label class="field-lbl">Campaign Name <span style="color:#666;">(unique — used to prevent duplicate sends)</span></label>
    <input type="text" class="field-inp" id="camp-name" placeholder="e.g. September Check-In">
    <label class="field-lbl">Subject Line</label>
    <input type="text" class="field-inp" id="camp-subject" placeholder="e.g. We'd love to hear from you!">
    <div class="field-hint">Tip: use {{firstName}} anywhere in the subject or body to personalize per recipient.</div>
    <label class="field-lbl">Email HTML Body</label>
    <textarea class="field-inp" id="camp-html" placeholder="Paste the full HTML for this email here..."></textarea>
    <iframe id="preview-frame"></iframe>
    <div class="btn-row">
      <button class="btn btn-outline" onclick="togglePreview()" id="preview-btn">Preview</button>
      <button class="btn btn-outline" onclick="saveCampaign(false)" id="save-btn">Save Draft</button>
      <button class="btn btn-outline" onclick="sendTest()" id="test-btn">Send Test to Me</button>
      <button class="btn btn-gold" onclick="confirmSend()" id="send-btn">Send to All Users</button>
    </div>
    <div class="status-msg" id="compose-status"></div>
  </div>

  <div class="card">
    <div class="card-title"><span class="dot"></span>Past Campaigns</div>
    <div id="campaigns-list"><div class="empty-state">Loading...</div></div>
  </div>
</div>

<script>
const BACKEND = "https://app.audlabs.io";
let adminPassword = "";
let currentSlug = null;

  function toggleAdminPwd(){
  var pwInput = document.getElementById("admin-pass");
  var eyeBtn = document.getElementById("admin-pwd-eye");
  if(pwInput.type === "password"){
    pwInput.type = "text";
    eyeBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  } else {
    pwInput.type = "password";
    eyeBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  }
}
function adminLogin(){
  const pass = document.getElementById("admin-pass").value;
  if(!pass){ document.getElementById("login-err").textContent = "Please enter password"; return; }
  if(pass !== "(Oluwaseyi23)"){
    document.getElementById("login-err").textContent = "Incorrect password";
    return;
  }
  adminPassword = "audlabs-admin-2026";
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
  loadCampaigns();
}
function adminLogout(){
  adminPassword = "";
  document.getElementById("dashboard").style.display = "none";
  document.getElementById("login-screen").style.display = "flex";
  document.getElementById("admin-pass").value = "";
}
function showStatus(msg, ok){
  const el = document.getElementById("compose-status");
  el.textContent = msg;
  el.className = "status-msg " + (ok ? "status-ok" : "status-err");
  el.style.display = "block";
}
function togglePreview(){
  const frame = document.getElementById("preview-frame");
  const html = document.getElementById("camp-html").value;
  if(frame.style.display === "block"){
    frame.style.display = "none";
    document.getElementById("preview-btn").textContent = "Preview";
  } else {
    if(!html.trim()){ showStatus("Paste some HTML first to preview it.", false); return; }
    frame.style.display = "block";
    frame.srcdoc = html;
    document.getElementById("preview-btn").textContent = "Hide Preview";
  }
}
async function saveCampaign(silent){
  const name = document.getElementById("camp-name").value.trim();
  const subject = document.getElementById("camp-subject").value.trim();
  const html = document.getElementById("camp-html").value.trim();
  if(!name || !subject || !html){ showStatus("Please fill in campaign name, subject, and HTML body.", false); return null; }
  try{
    const res = await fetch(BACKEND + "/api/admin/save-campaign", {
      method: "POST",
      headers: {"Content-Type":"application/json","x-admin-secret":adminPassword},
      body: JSON.stringify({ name, subject, htmlBody: html })
    });
    const data = await res.json();
    if(!data.success){ showStatus(data.error || "Failed to save", false); return null; }
    currentSlug = data.slug;
    if(!silent){ showStatus("✅ Draft saved successfully.", true); loadCampaigns(); }
    return data.slug;
  }catch(e){ showStatus("Error: " + e.message, false); return null; }
}
async function sendTest(){
  const btn = document.getElementById("test-btn");
  const slug = await saveCampaign(true);
  if(!slug) return;
  btn.disabled = true; btn.textContent = "Sending...";
  try{
    const res = await fetch(BACKEND + "/api/admin/send-campaign-v2", {
      method: "POST",
      headers: {"Content-Type":"application/json","x-admin-secret":adminPassword,"x-test-mode":"true"},
      body: JSON.stringify({ slug })
    });
    const data = await res.json();
    if(data.success){ showStatus("✅ Test email sent to your own inbox.", true); }
    else { showStatus(data.error || "Failed to send test", false); }
  }catch(e){ showStatus("Error: " + e.message, false); }
  btn.disabled = false; btn.textContent = "Send Test to Me";
}
async function confirmSend(){
  if(!confirm("Send this campaign to ALL users now? This cannot be undone.")) return;
  const btn = document.getElementById("send-btn");
  let slug = currentSlug;
  if(!slug){
    slug = await saveCampaign(true);
    if(!slug) return;
  }
  btn.disabled = true;
  let totalSent = 0, totalFailed = 0, batchNum = 0;
  try{
    while(true){
      batchNum++;
      btn.textContent = "Sending batch "+batchNum+"... ("+totalSent+" sent so far)";
      const res = await fetch(BACKEND + "/api/admin/send-campaign-v2", {
        method: "POST",
        headers: {"Content-Type":"application/json","x-admin-secret":adminPassword},
        body: JSON.stringify({ slug })
      });
      const data = await res.json();
      if(!data.success){ showStatus(data.error || "Failed to send", false); break; }
      totalSent += data.sent;
      totalFailed += data.failed;
      if(data.sent === 0){
        showStatus(`✅ Done. Sent to ${totalSent} users total (${totalFailed} failed).`, true);
        loadCampaigns();
        break;
      }
      showStatus(`In progress — ${totalSent} sent so far (batch ${batchNum})...`, true);
    }
  }catch(e){ showStatus("Error after "+totalSent+" sent: " + e.message, false); }
  btn.disabled = false; btn.textContent = "Send to All Users";
}
async function loadCampaigns(){
  try{
    const res = await fetch(BACKEND + "/api/admin/campaigns-list", {
      headers: {"x-admin-secret":adminPassword}
    });
    const data = await res.json();
    const list = document.getElementById("campaigns-list");
    if(!data.success || !data.campaigns.length){
      list.innerHTML = '<div class="empty-state">No campaigns yet. Compose your first one above.</div>';
      return;
    }
    list.innerHTML = data.campaigns.map(function(c){
      const isSent = !!c.sentAt;
      const dateStr = new Date(c.createdAt).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
      return `<div class="campaign-item">
        <div>
          <div class="campaign-name">${c.name}</div>
          <div class="campaign-sub">${c.subject} · ${dateStr}${isSent ? ` · ${c.sentCount} sent, ${c.failedCount} failed` : ""}</div>
          ${isSent ? `<div class="campaign-sub" id="opens-${c.slug}" style="color:#c9a84c;">Loading opens...</div>` : ""}
        </div>
                <div style="display:flex;align-items:center;gap:10px;">
          <span class="campaign-badge ${isSent ? "badge-sent" : "badge-draft"}">${isSent ? "Sent" : "Draft"}</span>
          <button class="btn btn-outline" style="padding:6px 12px;font-size:12px;" onclick='loadIntoEditor(${JSON.stringify(c).replace(/'/g,"&apos;")})'>Load</button>
          ${!isSent ? `<button class="btn btn-red" style="padding:6px 12px;font-size:12px;" onclick="deleteDraft('${c.slug}')">Delete</button>` : ""}
        </div>
      </div>`;
    }).join("");
    data.campaigns.forEach(function(c){
      if(c.sentAt) loadOpenCount(c.slug, c.sentCount);
    });
  }catch(e){
    document.getElementById("campaigns-list").innerHTML = '<div class="empty-state">Failed to load campaigns.</div>';
  }
}
async function loadOpenCount(slug, sentCount){
  try{
    const res = await fetch(BACKEND + "/api/admin/campaign-opens?slug=" + slug, {
      headers: {"x-admin-secret":adminPassword}
    });
    const data = await res.json();
    const el = document.getElementById("opens-" + slug);
    if(el && data.success){
      const pct = sentCount > 0 ? Math.round((data.uniqueOpens / sentCount) * 100) : 0;
      el.textContent = `👁 ${data.uniqueOpens} opened (${pct}% open rate)`;
    }
  }catch(e){}
}
  async function deleteDraft(slug){
  if(!confirm("Delete this draft campaign? This cannot be undone.")) return;
  try{
    const res = await fetch(BACKEND + "/api/admin/delete-campaign", {
      method: "POST",
      headers: {"Content-Type":"application/json","x-admin-secret":adminPassword},
      body: JSON.stringify({ slug })
    });
    const data = await res.json();
    if(data.success){ loadCampaigns(); }
    else { alert(data.error || "Failed to delete"); }
  }catch(e){ alert("Error: " + e.message); }
}
function loadIntoEditor(c){
  document.getElementById("camp-name").value = c.name;
  document.getElementById("camp-subject").value = c.subject;
  document.getElementById("camp-html").value = c.htmlBody;
  currentSlug = c.slug;
  window.scrollTo({top:0,behavior:"smooth"});
}
</script>
</body>
</html>
