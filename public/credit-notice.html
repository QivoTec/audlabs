<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AudLabs — Credit Expiry Notice</title>
<link rel="icon" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0d0d0d;color:#eee;font-family:'Inter',sans-serif;min-height:100vh;}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.login-card{background:#161616;border:1px solid #262626;border-radius:16px;padding:40px;max-width:380px;width:100%;}
.login-card h1{font-size:18px;font-weight:700;color:#c9a84c;margin-bottom:4px;}
.login-card p{font-size:13px;color:#888;margin-bottom:24px;}
.login-inp{width:100%;background:#0d0d0d;border:1.5px solid #262626;border-radius:8px;padding:12px 14px;font-size:14px;color:#eee;outline:none;margin-bottom:12px;font-family:'Inter',sans-serif;}
.login-btn{width:100%;background:linear-gradient(180deg,#e8c97a 0%,#c9a84c 45%,#b8934a 100%);border:1px solid rgba(184,147,74,0.5);color:#111;padding:12px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;}
.login-err{font-size:12px;color:#e74c3c;margin-top:10px;text-align:center;}
#dashboard{display:none;max-width:900px;margin:0 auto;padding:32px 20px 60px;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
.topbar h1{font-size:20px;font-weight:700;color:#fff;}
.expiry-input-row{display:flex;gap:10px;align-items:center;background:#161616;border:1px solid #262626;border-radius:10px;padding:16px;margin-bottom:20px;}
.expiry-input-row label{font-size:13px;color:#888;white-space:nowrap;}
.expiry-input-row input{background:#0d0d0d;border:1.5px solid #262626;border-radius:8px;padding:10px 12px;font-size:14px;color:#eee;outline:none;font-family:'Inter',sans-serif;}
.btn{padding:10px 20px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:'Inter',sans-serif;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
.btn-gold{background:linear-gradient(180deg,#e8c97a 0%,#c9a84c 45%,#b8934a 100%);color:#111;}
.btn-outline{background:transparent;border:1.5px solid #333;color:#ccc;}
.btn-danger{background:#3a1a1a;border:1.5px solid #5a2a2a;color:#ff8080;}
.user-list{background:#161616;border:1px solid #262626;border-radius:14px;overflow:hidden;margin-bottom:20px;}
.user-row{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid #222;}
.user-row:last-child{border-bottom:none;}
.user-row input[type="checkbox"]{width:18px;height:18px;flex-shrink:0;}
.user-info{flex:1;}
.user-name{font-size:14px;font-weight:600;color:#fff;}
.user-email{font-size:12px;color:#888;}
.user-credits{font-size:14px;font-weight:700;color:#c9a84c;white-space:nowrap;}
.status-msg{font-size:13px;margin-top:14px;padding:12px 16px;border-radius:8px;display:none;}
.status-ok{background:rgba(39,174,96,0.1);color:#27ae60;}
.status-err{background:rgba(231,76,60,0.1);color:#e74c3c;}
.empty-state{text-align:center;color:#666;font-size:13px;padding:40px 20px;}
.select-all-row{display:flex;align-items:center;gap:10px;padding:12px 18px;background:#1a1a1a;border-bottom:1px solid #262626;font-size:12px;color:#999;}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h1>Credit Expiry Notice</h1>
    <p>Admin access required.</p>
    <input type="password" class="login-inp" id="admin-pass" placeholder="Admin password" onkeydown="if(event.key==='Enter')adminLogin()">
    <button class="login-btn" onclick="adminLogin()">Sign In</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<div id="dashboard">
  <div class="topbar">
    <h1>Credit Expiry Notice — High Balance Users</h1>
    <button class="btn btn-outline" onclick="location.reload()">Sign Out</button>
  </div>

  <div class="expiry-input-row">
    <label>Expiry date to show in the email:</label>
    <input type="text" id="expiry-date" placeholder="e.g. October 21, 2026" value="October 21, 2026">
  </div>

  <div id="loading" style="text-align:center;color:#888;padding:40px;">Loading users with 25,000+ credits...</div>
  <div id="user-list-container" style="display:none;">
    <div class="user-list" id="user-list"></div>
    <div style="display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;">
      <div style="font-size:13px;color:#888;" id="selected-count">0 selected</div>
      <button class="btn btn-danger" id="send-btn" onclick="sendNotices()">Send Notice to Selected Users</button>
    </div>
    <div class="status-msg" id="status"></div>
  </div>
</div>

<script>
const BACKEND = "https://app.audlabs.io";
let adminPassword = "";
let allUsers = [];

function adminLogin(){
  const pass = document.getElementById("admin-pass").value;
  if(pass !== "(Oluwaseyi23)"){
    document.getElementById("login-err").textContent = "Incorrect password";
    return;
  }
  adminPassword = "audlabs-admin-2026";
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
  loadUsers();
}

async function loadUsers(){
  try{
    const res = await fetch(BACKEND + "/api/admin/high-balance-users", {
      headers: {"x-admin-secret": adminPassword}
    });
    const data = await res.json();
    document.getElementById("loading").style.display = "none";
    if(!data.success || !data.users.length){
      document.getElementById("user-list-container").innerHTML = '<div class="empty-state">No users found with 25,000+ credits.</div>';
      document.getElementById("user-list-container").style.display = "block";
      return;
    }
    allUsers = data.users;
    renderUserList();
    document.getElementById("user-list-container").style.display = "block";
  }catch(e){
    document.getElementById("loading").textContent = "Failed to load users: " + e.message;
  }
}

function renderUserList(){
  const list = document.getElementById("user-list");
  let html = `<div class="select-all-row"><input type="checkbox" id="select-all" onclick="toggleSelectAll(this)"> Select All (${allUsers.length} users)</div>`;
  html += allUsers.map(function(u, i){
    return `<div class="user-row">
      <input type="checkbox" class="user-checkbox" data-uid="${u.uid}" onclick="updateSelectedCount()">
      <div class="user-info">
        <div class="user-name">${u.name}</div>
        <div class="user-email">${u.email}</div>
      </div>
      <div class="user-credits">${u.credits.toLocaleString()} credits</div>
    </div>`;
  }).join("");
  list.innerHTML = html;
  updateSelectedCount();
}

function toggleSelectAll(checkbox){
  document.querySelectorAll(".user-checkbox").forEach(function(cb){ cb.checked = checkbox.checked; });
  updateSelectedCount();
}

function updateSelectedCount(){
  const count = document.querySelectorAll(".user-checkbox:checked").length;
  document.getElementById("selected-count").textContent = count + " selected";
}

async function sendNotices(){
  const selected = Array.from(document.querySelectorAll(".user-checkbox:checked")).map(function(cb){ return cb.dataset.uid; });
  const expiryDate = document.getElementById("expiry-date").value.trim();
  const statusEl = document.getElementById("status");
  const btn = document.getElementById("send-btn");
  if(!selected.length){
    statusEl.className = "status-msg status-err"; statusEl.textContent = "Please select at least one user."; statusEl.style.display = "block";
    return;
  }
  if(!expiryDate){
    statusEl.className = "status-msg status-err"; statusEl.textContent = "Please enter an expiry date."; statusEl.style.display = "block";
    return;
  }
  if(!confirm("Send credit expiry notice to " + selected.length + " user(s)? This cannot be undone.")) return;
  btn.disabled = true;
  btn.textContent = "Sending...";
  try{
    const res = await fetch(BACKEND + "/api/admin/send-credit-expiry-notice", {
      method: "POST",
      headers: {"Content-Type":"application/json","x-admin-secret":adminPassword},
      body: JSON.stringify({ uids: selected, expiryDate: expiryDate })
    });
    const data = await res.json();
    if(data.success){
      statusEl.className = "status-msg status-ok";
      statusEl.textContent = "Sent to " + data.sentCount + " user(s)." + (data.failedCount ? " " + data.failedCount + " failed." : "");
      statusEl.style.display = "block";
    } else {
      statusEl.className = "status-msg status-err"; statusEl.textContent = data.error || "Failed to send notices."; statusEl.style.display = "block";
    }
  }catch(e){
    statusEl.className = "status-msg status-err"; statusEl.textContent = "Error: " + e.message; statusEl.style.display = "block";
  }
  btn.disabled = false;
  btn.textContent = "Send Notice to Selected Users";
}
</script>
</body>
</html>
