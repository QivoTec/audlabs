<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AudLabs Mobile App — Download on Android</title>
<meta name="description" content="Generate AI voiceovers, clone your voice, and create content faster — right from your phone. Download the AudLabs app for Android. iOS coming soon.">
<link rel="icon" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#030E2E;color:#fff;overflow-x:hidden;}
nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:16px 40px;display:flex;align-items:center;justify-content:space-between;background:rgba(3,14,46,0.85);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,0.06);}
.nav-logo{display:flex;align-items:center;gap:12px;text-decoration:none;}
.nav-logo img{width:32px;height:32px;min-width:32px;min-height:32px;max-width:32px;max-height:32px;object-fit:contain;filter:drop-shadow(0 4px 16px rgba(0,100,255,0.3));display:block;}
.nav-brand{font-family:'Space Mono',monospace;font-size:15px;letter-spacing:0.15em;color:#fff;font-weight:700;}
.nav-home{background:linear-gradient(180deg,rgba(255,255,255,0.08),rgba(255,255,255,0.02));border:1px solid rgba(255,255,255,0.22);color:#fff;padding:9px 22px;border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all 0.2s;text-decoration:none;}
.nav-home:hover{border-color:rgba(201,168,76,0.6);color:#c9a84c;}
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:140px 24px 100px;position:relative;}
.hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse at center top,rgba(201,168,76,0.12),transparent 60%);pointer-events:none;}
.hero-badge{display:inline-block;background:rgba(201,168,76,0.1);color:#c9a84c;font-size:12px;font-weight:600;padding:6px 16px;border-radius:100px;margin-bottom:24px;border:1px solid rgba(201,168,76,0.25);}
.hero-title{font-size:52px;font-weight:800;line-height:1.15;margin-bottom:20px;max-width:800px;}
.hero-title em{color:#c9a84c;font-style:normal;}
.hero-sub{font-size:18px;color:rgba(255,255,255,0.6);max-width:560px;margin:0 auto 44px;line-height:1.6;}
.store-buttons{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
.store-btn{display:flex;align-items:center;gap:12px;background:#fff;color:#111;padding:12px 24px;border-radius:12px;text-decoration:none;transition:all 0.2s;min-width:210px;}
.store-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.3);}
.store-btn.disabled{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.4);cursor:default;pointer-events:none;}
.store-btn-icon{width:30px;height:30px;min-width:30px;min-height:30px;max-width:30px;max-height:30px;flex-shrink:0;object-fit:contain;display:block;}
.store-btn-text{text-align:left;}
.store-btn-small{font-size:10px;text-transform:uppercase;letter-spacing:0.05em;opacity:0.7;}
.store-btn-big{font-size:16px;font-weight:700;}
footer{padding:32px 24px;text-align:center;border-top:1px solid rgba(255,255,255,0.06);}
footer p{font-size:12px;color:rgba(255,255,255,0.3);}
footer a{color:rgba(201,168,76,0.7);text-decoration:none;}
@media(max-width:768px){
nav{padding:12px 16px;}
.hero-title{font-size:32px;}
.hero-sub{font-size:15px;}
}
</style>
</head>
<body>

<nav>
  <a href="https://audlabs.io" class="nav-logo">
    <img src="https://audlabs.io/logo.png" alt="AudLabs" width="32" height="32">
    <span class="nav-brand">AudLabs</span>
  </a>
  <a href="https://audlabs.io" class="nav-home">Back to Home</a>
</nav>

<section class="hero">
  <div class="hero-bg"></div>
  <div>
    <div class="hero-badge">✦ Now on Google Play</div>
    <h1 class="hero-title">Your voice studio.<br>Now in your <em>pocket.</em></h1>
    <p class="hero-sub">Generate natural AI voiceovers, clone your voice, and create content faster — right from your phone.</p>
    <div class="store-buttons">
      <a href="https://play.google.com/store/apps/details?id=io.audlabs.app" target="_blank" class="store-btn">
        <img src="https://audlabs.io/google-play-icon.png" class="store-btn-icon" alt="Google Play" width="30" height="30">
        <span class="store-btn-text"><span class="store-btn-small">Get it on</span><br><span class="store-btn-big">Google Play</span></span>
      </a>
      <span class="store-btn disabled">
        <img src="https://audlabs.io/apple-icon.png" class="store-btn-icon" alt="App Store" width="30" height="30">
        <span class="store-btn-text"><span class="store-btn-small">Coming soon on</span><br><span class="store-btn-big">App Store</span></span>
      </span>
    </div>
  </div>
</section>

<footer>
  <p>© 2026 AudLabs. All rights reserved. · <a href="/privacy-policy">Privacy Policy</a> · <a href="/status">Status</a></p>
</footer>

</body>
</html>
